# Cloudflare Pages : site statique (dist/) + fonctions /api/* (dossier functions/)
name = "obedgpt"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Variables non secrètes (facultatif) :
# [vars]
# GROQ_MODEL = "openai/gpt-oss-120b"
#
# Secrets (à ne PAS écrire ici) :
#   npx wrangler pages secret put GROQ_API_KEYS --project-name obedgpt

# Comptes + historique serveur (facultatif) : crée un namespace KV puis lie-le.
#   npx wrangler kv namespace create AUTH_KV
# [[kv_namespaces]]
# binding = "AUTH_KV"
# id = "<id affiché par la commande>"
