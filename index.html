<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ObedGPT — Assistant IA</title>
    <meta name="description" content="ObedGPT — Assistant IA propulsé par Groq : chat, code et synthèse vocale." />

    <!-- Thème + accent appliqués avant le premier rendu (évite le flash). -->
    <script>
      try {
        var pref = localStorage.getItem('obedgpt-theme-pref') || 'auto'
        var dark = pref === 'auto' ? window.matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark'
        if (dark) document.documentElement.classList.add('dark')
        var acc = localStorage.getItem('obedgpt-accent')
        if (acc && acc !== 'vert') document.documentElement.setAttribute('data-accent', acc)
      } catch (e) {}
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ObedGPT" />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="fr_FR" />
